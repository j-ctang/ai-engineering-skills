[dependency-groups]
dev = ["mypy==2.4.0", "ruff==0.17.0"]

[tool.ruff]
line-length = 105
target-version = "py313"

[tool.mypy]
python_version = "3.13"
files = ["scripts"]
strict = true

# Tests stay unannotated, but mypy still checks their bodies.
[[tool.mypy.overrides]]
module = ["test_review_pr", "test_check_dco", "test_github_prs"]
disallow_untyped_defs = false
disallow_untyped_calls = false
